<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Koyu Obsidyen Yuvarlak Köşeli Kare Zemin (#0d0907) -->
  <rect width="64" height="64" rx="14" fill="#0d0907" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Kürsü Ses Takozu (Sound Block) -->
  <path d="M12 50C12 48.3431 13.3431 47 15 47H35C36.6569 47 38 48.3431 38 50V52H12V50Z" fill="#d97706" />
  <rect x="10" y="52" width="30" height="3.5" rx="1.75" fill="#f59e0b" />

  <!-- Tokmak Vuruş Kıvılcım Çizgileri -->
  <path d="M14 42L10 39" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M36 42L40 39" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

  <!-- Mahkeme Tokmağı (Judge Gavel) -->
  <g transform="rotate(-45 32 28)">
    <!-- Tokmak Sapı -->
    <rect x="29.5" y="24" width="5" height="28" rx="2.5" fill="url(#handleGrad)" />
    <!-- Tokmak Gövdesi -->
    <rect x="16" y="13" width="32" height="12" rx="3" fill="url(#amberGrad)" />
    <!-- Altın Bilezik Halkaları -->
    <rect x="20" y="12" width="3" height="14" rx="1" fill="#fef3c7" fill-opacity="0.85" />
    <rect x="41" y="12" width="3" height="14" rx="1" fill="#fef3c7" fill-opacity="0.85" />
    <!-- Tokmak Uç Başlıkları -->
    <rect x="13.5" y="14.5" width="3" height="9" rx="1.5" fill="#b45309" />
    <rect x="47.5" y="14.5" width="3" height="9" rx="1.5" fill="#b45309" />
  </g>
</svg>
